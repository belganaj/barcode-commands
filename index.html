<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>تأكيد الطلبيات</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,Arial;background:#f4f7f8;color:#172026}header{background:#0f766e;color:#fff;padding:17px 15px;position:sticky;top:0;z-index:5}h1{margin:0 0 10px;font-size:22px}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:#ffffff22;border:1px solid #ffffff33;border-radius:12px;padding:7px 10px;font-size:13px}main{max-width:820px;margin:auto;padding:14px}.box{background:#fff;border:1px solid #dce5e7;border-radius:16px;padding:14px;margin-bottom:12px}button,input{font:inherit}button{border:0;border-radius:13px;padding:12px 15px;font-weight:700;cursor:pointer}.scan{background:#0f766e;color:#fff}.secondary{background:#fff;border:1px solid #ccd7da}input[type=file]{width:100%;padding:12px;background:#f8fafb;border:1px dashed #b9c7cb;border-radius:12px}input[type=text]{width:100%;padding:12px;border:1px solid #ccd6d9;border-radius:13px}#reader{display:none;background:#000;border-radius:16px;overflow:hidden;margin:10px 0}.result{display:none;border-radius:15px;padding:14px;margin:10px 0;background:#fff;border:1px solid #dfe7e9}.result.ok{display:block;border-color:#6fcf97;background:#f0fff6}.result.warn{display:block;border-color:#f0b44d;background:#fffaf0}.result.bad{display:block;border-color:#ef7777;background:#fff5f5}.list{display:grid;gap:9px}.card{background:#fff;border:1px solid #dde5e7;border-radius:15px;padding:12px}.card.received{background:#effcf4;border-color:#71c995}.top{display:flex;justify-content:space-between;gap:8px}.code{font-weight:800;direction:ltr}.badge{font-size:12px;border-radius:20px;padding:5px 9px;background:#eef1f2}.received .badge{background:#c9f3d9;color:#126b37}.meta{color:#52636a;font-size:14px;line-height:1.65;margin-top:6px}.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.actions button{padding:8px 11px;font-size:13px}.history{display:grid;gap:8px}.manifest{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafb;border:1px solid #dfe7e9;border-radius:13px;padding:10px}.manifest.active{border-color:#0f766e;background:#effaf8}.manifest b{display:block}.small{font-size:12px;color:#64747a}.ltr{direction:ltr}.muted{color:#68787e;font-size:13px;text-align:center;padding:18px}.progress{display:none;height:8px;background:#e8eeee;border-radius:10px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#0f766e;transition:.2s}dialog{border:0;border-radius:18px;padding:0;width:min(92vw,430px);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0008}.dlg{padding:20px}
</style></head><body><header><h1>📦 تأكيد الطلبيات</h1><div class="stats"><div class="stat">كل الطلبيات: <b id="total">0</b></div><div class="stat">تم التوصل: <b id="received">0</b></div><div class="stat">متبقية: <b id="remaining">0</b></div></div></header><main>
<div class="box"><h2>📄 رفع Manifest جديد</h2><input id="pdf" type="file" accept="application/pdf"><p style="font-size:12px;color:#64747a">سيتم قراءة الـPDF وحفظ الملف في Google Sheets مع تاريخ الرفع.</p><button class="scan" id="uploadBtn" onclick="importPdf()">⬆️ قراءة الملف وحفظه</button><div class="progress" id="progress"><div class="bar" id="bar"></div></div></div>
<div class="box"><h2>🗂️ الملفات السابقة</h2><div id="history"><div class="muted">جارٍ التحميل...</div></div></div>
<div class="box"><button class="scan" onclick="startScanner()">📷 مسح Barcode</button><div id="reader"></div><div id="result" class="result"></div></div>
<div class="box"><input id="search" type="text" placeholder="🔎 ابحث بالكود، الاسم، الهاتف أو المدينة..." oninput="render()"></div><div id="list" class="list"></div></main>
<dialog id="dlg"><div class="dlg"><h2>تأكيد الاستلام</h2><p id="dlgText"></p><div class="actions"><button class="scan" onclick="confirmReceive()">✅ نعم، تم التوصل</button><button class="secondary" onclick="closeDlg()">إلغاء</button></div></div></dialog>
<script>
const API_URL="PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";let manifests=[],active=null,received={},pending=null,scanner=null,pdfjs=null;const KEY="order_checker_";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const saveLocal=()=>active&&localStorage.setItem(KEY+active.id,JSON.stringify(received));
function stats(){let n=Object.keys(received).length,t=active?.orders.length||0;total.textContent=t;receivedEl.textContent=n;remaining.textContent=t-n}const receivedEl=document.getElementById('received');
function render(){if(!active){list.innerHTML='<div class="muted">اختر ملفًا من السجل أو ارفع ملف PDF جديدًا.</div>';stats();return}let q=search.value.trim().toLowerCase(),a=active.orders.filter(o=>!q||[o.barcode,o.name,o.phone,o.city,o.address,o.store,o.product].join(' ').toLowerCase().includes(q));list.innerHTML=a.length?a.map(o=>{let d=!!received[o.barcode];return `<div class="card ${d?'received':''}"><div class="top"><span class="code">${esc(o.barcode)}</span><span class="badge">${d?'✅ تم التوصل':'⏳ لم يتم التوصل'}</span></div><div class="meta">👤 <b>${esc(o.name)}</b><br>📍 ${esc(o.city)} — ${esc(o.address)}<br>📞 <span class="ltr">${esc(o.phone)}</span><br>💰 ${esc(o.price)} DH | الكمية: ${esc(o.quantity)}</div><div class="actions">${d?`<button class="secondary" onclick="undo('${esc(o.barcode)}')">↩️ إلغاء الاستلام</button>`:`<button class="scan" onclick="mark('${esc(o.barcode)}')">✅ تسجيل الاستلام</button>`}</div></div>`}).join(''):'<div class="muted">لا توجد نتائج.</div>';stats()}
function result(cls,title,body){resultEl.className='result '+cls;resultEl.innerHTML=`<h2>${title}</h2>${body}`}const resultEl=document.getElementById('result');
function jsonp(url){return new Promise((res,rej)=>{let cb='cb_'+Date.now();window[cb]=x=>{delete window[cb];s.remove();res(x)};let s=document.createElement('script');s.src=url+'&callback='+cb;s.onerror=()=>rej(Error('JSONP'));document.body.appendChild(s)})}
async function loadHistory(){try{if(!API_URL.includes('script.google.com'))throw 0;let d=await jsonp(API_URL+'?action=list&_='+Date.now());manifests=d.manifests||[];localStorage.setItem(KEY+'manifests',JSON.stringify(manifests))}catch(e){manifests=JSON.parse(localStorage.getItem(KEY+'manifests')||'[]')}renderHistory()}
function renderHistory(){history.innerHTML=manifests.length?manifests.map(m=>`<div class="manifest ${active?.id===m.id?'active':''}"><div><b>📄 ${esc(m.fileName)}</b><span class="small">📅 ${esc(m.date)} • ${m.count} طلبية</span></div><button class="secondary" onclick="openManifest('${esc(m.id)}')">فتح</button></div>`).join(''):'<div class="muted">لا توجد ملفات محفوظة بعد.</div>'}
async function openManifest(id){try{if(API_URL.includes('script.google.com')){let d=await jsonp(API_URL+'?action=get&id='+encodeURIComponent(id)+'&_='+Date.now());active=d.manifest}else throw 0}catch(e){active=manifests.find(x=>x.id===id)}if(active){received=JSON.parse(localStorage.getItem(KEY+active.id)||'{}');renderHistory();render()}}
function find(code){code=String(code||'').trim().toUpperCase();return active?.orders.find(o=>String(o.barcode).toUpperCase()===code)}
function mark(code){let o=find(code);if(!o)return;if(received[o.barcode])return result('warn','⚠️ تم تسجيلها مسبقًا',`<b>${esc(o.barcode)}</b> — ${esc(o.name)}`);pending=o.barcode;dlgText.innerHTML=`هل تريد تسجيل استلام <b>${esc(o.barcode)}</b> للزبون <b>${esc(o.name)}</b>؟`;dlg.showModal()}
function confirmReceive(){if(!pending)return;received[pending]={at:new Date().toISOString()};saveLocal();syncReceipt(pending,true);let o=find(pending);closeDlg();render();result('ok','✅ تم تسجيل الاستلام',`<b>${esc(o.barcode)}</b><br>${esc(o.name)}`)}function undo(code){delete received[code];saveLocal();syncReceipt(code,false);render()}function closeDlg(){dlg.close();pending=null}
function syncReceipt(barcode,status){if(!API_URL.includes('script.google.com')||!active)return;fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'receipt',manifestId:active.id,barcode,status})}).catch(()=>{})}
async function importPdf(){let f=pdf.files[0];if(!f)return result('warn','⚠️ اختر ملف PDF','');uploadBtn.disabled=true;setProgress(5);try{if(!pdfjs){pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs'}let text=await extract(f),orders=parse(text);if(!orders.length)throw Error('لم يتم العثور على أكواد Tracking');let m={id:'m_'+Date.now(),fileName:f.name,date:new Date().toLocaleString('fr-MA'),count:orders.length,orders};setProgress(70);active=m;received={};manifests=[m,...manifests];localStorage.setItem(KEY+'manifests',JSON.stringify(manifests));saveLocal();renderHistory();render();if(API_URL.includes('script.google.com'))await send(m);setProgress(100);result('ok','✅ تم استيراد الملف',`تم العثور على <b>${orders.length}</b> طلبية وحفظها.`)}catch(e){result('bad','❌ فشل الاستيراد',esc(e.message))}finally{uploadBtn.disabled=false}}
async function extract(file){let b=await file.arrayBuffer(),p=await pdfjs.getDocument({data:b}).promise,out=[];for(let n=1;n<=p.numPages;n++){let page=await p.getPage(n),tc=await page.getTextContent(),items=tc.items.map(x=>({s:x.str,x:x.transform[4],y:x.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x),lines=[];for(let it of items){let l=lines.find(z=>Math.abs(z.y-it.y)<3);if(!l){l={y:it.y,a:[]};lines.push(l)}l.a.push(it)}lines.sort((a,b)=>b.y-a.y);out.push(lines.map(l=>l.a.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ')).join('\n'))}return out.join('\n')}
function parse(text){let lines=text.split(/\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),out=[],re=/\b(S[A-Z0-9]{7,10})\b/g;for(let i=0;i<lines.length;i++){let m=lines[i].match(re);if(!m)continue;let barcode=m[0];if(out.some(o=>o.barcode===barcode))continue;let c=lines.slice(i,i+8).join(' '),phone=(c.match(/\b0[5-7]\d{8}\b/)||[''])[0],city=(c.match(/\b(Tiznit|Tafraout|Mirleft)\b/i)||[''])[0],nums=[...c.matchAll(/\b\d+(?:\.\d+)?\b/g)].map(x=>Number(x[0])).filter(n=>n>=0&&n<=5000),price=nums.length?nums[nums.length-1]:0,q=nums.find(n=>n>=1&&n<=20)||1,after=c.split(barcode)[1]||'',parts=after.split(/\s+/).filter(Boolean);out.push({barcode,type:parts[0]||'LN',store:parts[1]||'',product:parts.slice(2,14).join(' '),quantity:q,price,address:'',city,name:'',phone,status:'En cours de dispatch'})}return out}
async function send(m){await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'import',manifest:m})})}function setProgress(v){document.getElementById('progress').style.display='block';bar.style.width=v+'%'}
async function startScanner(){if(!active)return result('warn','⚠️ اختر ملفًا أولًا','');reader.style.display='block';if(!window.Html5Qrcode)await new Promise((r,j)=>{let s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)});try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:140}},code=>{scanner.stop().then(()=>{scanner.clear();reader.style.display='none';let o=find(code);if(!o)return result('bad','❌ الطلبية غير موجودة',`الكود: <b>${esc(code)}</b>`);if(received[o.barcode])result('warn','⚠️ تم تسجيلها مسبقًا',`<b>${esc(o.barcode)}</b><br>${esc(o.name)}`);else{result('ok','✅ تم العثور على الطلبية',`<b>${esc(o.barcode)}</b><br>${esc(o.name)}<br>${esc(o.price)} DH`);mark(o.barcode)}})})}catch(e){reader.style.display='none';result('bad','❌ تعذر تشغيل الكاميرا','اسمح للمتصفح باستخدام الكاميرا.')}}
loadHistory();render();
</script></body></html>

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#f4f7f8;color:#172026}
header{background:#0f766e;color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
h1{margin:0 0 12px;font-size:22px} .stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#ffffff22;border:1px solid #ffffff33;border-radius:12px;padding:8px 11px;font-size:13px}
main{max-width:760px;margin:auto;padding:14px}
.controls{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
button,input{font:inherit}button{border:0;border-radius:14px;padding:14px 16px;font-weight:700;cursor:pointer}
.scan{background:#0f766e;color:#fff;font-size:17px} .secondary{background:#fff;border:1px solid #d5dde0;color:#243238}
input{width:100%;padding:13px 14px;border:1px solid #ccd6d9;border-radius:14px;background:#fff;outline:none}
input:focus{border-color:#0f766e;box-shadow:0 0 0 3px #0f766e18}
#reader{display:none;background:#000;border-radius:16px;overflow:hidden;margin:10px 0}
#reader video{width:100%;display:block}
.result{display:none;border-radius:16px;padding:15px;margin:12px 0;background:#fff;border:1px solid #dfe7e9}
.result.ok{display:block;border-color:#6fcf97;background:#f0fff6} .result.warn{display:block;border-color:#f0b44d;background:#fffaf0} .result.bad{display:block;border-color:#ef7777;background:#fff5f5}
.result h2{margin:0 0 7px;font-size:20px} .result p{margin:5px 0}
.list{display:grid;gap:10px}
.card{background:#fff;border:1px solid #dde5e7;border-radius:15px;padding:13px;transition:.2s}
.card.received{background:#effcf4;border-color:#71c995} .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.code{font-weight:800;direction:ltr;unicode-bidi:plaintext} .badge{font-size:12px;border-radius:20px;padding:5px 9px;background:#eef1f2}
.received .badge{background:#c9f3d9;color:#126b37}
.meta{color:#52636a;font-size:14px;line-height:1.65;margin-top:7px}
.actions{display:flex;gap:8px;margin-top:10px} .actions button{padding:9px 12px;font-size:13px}
.hidden{display:none!important} .muted{color:#68787e;font-size:13px;text-align:center;padding:20px}
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,420px);box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0008} .dlg{padding:20px} .dlg h2{margin-top:0}
.small{font-size:12px;color:#64747a} .ltr{direction:ltr;unicode-bidi:plaintext}
</style>
</head>

<header>
  <h1>📦 تأكيد الطلبيات</h1>
  <div class="stats">
    <div class="stat">كل الطلبيات: <b id="total">43</b></div>
    <div class="stat">تم التوصل: <b id="received">0</b></div>
    <div class="stat">متبقية: <b id="remaining">43</b></div>
  </div>
</header>

<main>
  <div class="controls">
    <button class="scan" onclick="startScanner()">📷 مسح Barcode</button>
    <input id="search" placeholder="🔎 ابحث بالكود، الاسم، الهاتف أو المدينة..." oninput="render()">
    <button class="secondary" onclick="clearReceived()">إلغاء جميع علامات الاستلام</button>
  </div>

  <div id="reader"></div>
  <div id="result" class="result"></div>
  <div id="list" class="list"></div>
</main>

<dialog id="dlg"><div class="dlg">
  <h2>تأكيد الاستلام</h2>
  <p id="dlgText"></p>
  <div class="actions">
    <button class="scan" onclick="confirmReceive()">✅ نعم، تم التوصل</button>
    <button class="secondary" onclick="closeDlg()">إلغاء</button>
  </div>
</div></dialog>

  updateStats(); render();
}

function updateStats() {
  const n = Object.keys(received).length;
  document.getElementById("total").textContent = ORDERS.length;
  document.getElementById("received").textContent = n;
  document.getElementById("remaining").textContent = Math.max(0, ORDERS.length-n);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function card(o) {
  const done = !!received[o.barcode];
  return `<div class="card ${done ? "received":""}">
    <div class="top">
      <span class="code">${esc(o.barcode)}</span>
      <span class="badge">${done ? "✅ تم التوصل" : "⏳ لم يتم التوصل"}</span>
    </div>
    <div class="meta">
      👤 <b>${esc(o.name)}</b><br>
      📍 ${esc(o.city)} — ${esc(o.address)}<br>
      📞 <span class="ltr">${esc(o.phone)}</span><br>
      💰 ${esc(o.price)} DH &nbsp; | &nbsp; الكمية: ${esc(o.quantity)}
    </div>
    <div class="actions">
      ${done
        ? `<button class="secondary" onclick="undoReceive('${o.barcode}')">↩️ إلغاء الاستلام</button>`
        : `<button class="scan" onclick="markReceived('${o.barcode}')">✅ تسجيل الاستلام</button>`}
    </div>
  </div>`;
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = ORDERS.filter(o => !q || [o.barcode,o.name,o.phone,o.city,o.address,o.store,o.product].join(" ").toLowerCase().includes(q));
  document.getElementById("list").innerHTML = filtered.length ? filtered.map(card).join("") : '<div class="muted">لا توجد طلبية مطابقة للبحث.</div>';
  updateStats();
}

function showResult(type, title, body) {
  const el = document.getElementById("result");
  el.className = "result " + type;
  el.innerHTML = `<h2>${title}</h2><div>${body}</div>`;
}

function findOrder(code) {
  code = String(code || "").trim().toUpperCase();
  return ORDERS.find(o => o.barcode.toUpperCase() === code);
}

function markReceived(code) {
  const o = findOrder(code); if (!o) return;
  if (received[o.barcode]) {
    showResult("warn","⚠️ تم تسجيل هذه الطلبية مسبقًا", `<b>${esc(o.barcode)}</b> — ${esc(o.name)}`);
    return;
  }
  pendingBarcode = o.barcode;
  document.getElementById("dlgText").innerHTML = `هل تريد تسجيل استلام الطلبية <b class="ltr">${esc(o.barcode)}</b> للزبون <b>${esc(o.name)}</b>؟`;
  document.getElementById("dlg").showModal();
}

function confirmReceive() {
  if (!pendingBarcode) return;
  received[pendingBarcode] = {at:new Date().toISOString()};
  pendingBarcode = null; closeDlg(); save();
  const o = ORDERS.find(x => x.barcode === Object.keys(received).at(-1));
  if (o) showResult("ok","✅ تم تسجيل استلام الطلبية", `<b class="ltr">${esc(o.barcode)}</b><br>الزبون: ${esc(o.name)}`);
}

function undoReceive(code) {
  delete received[code]; save();
}

function closeDlg() { document.getElementById("dlg").close(); pendingBarcode=null; }

function clearReceived() {
  if (confirm("هل تريد إلغاء جميع علامات الاستلام؟")) { received={}; save(); document.getElementById("result").className="result"; }
}

async function startScanner() {
  const reader = document.getElementById("reader");
  reader.style.display = "block";
  if (!window.isSecureContext) {
    showResult("bad","❌ الكاميرا تحتاج HTTPS","افتح الموقع من GitHub Pages عبر HTTPS.");
    return;
  }
  if (!window.Html5Qrcode) {
    await loadScannerLib();
  }
  try {
    scanner = new Html5Qrcode("reader");
    const config = {fps:10, qrbox:{width:280,height:140}, aspectRatio:1.777};
    await scanner.start({facingMode:"environment"}, config, code => {
      scanner.stop().then(() => {
        scanner.clear(); reader.style.display="none";
        const o = findOrder(code);
        if (!o) {
          showResult("bad","❌ الطلبية غير موجودة", `الكود الممسوح: <b class="ltr">${esc(code)}</b>`);
          return;
        }
        if (received[o.barcode]) {
          showResult("warn","⚠️ هذه الطلبية تم تسجيل استلامها مسبقًا",
            `<b class="ltr">${esc(o.barcode)}</b><br>الزبون: ${esc(o.name)}`);
        } else {
          showResult("ok","✅ تم العثور على الطلبية",
            `<b class="ltr">${esc(o.barcode)}</b><br>الزبون: ${esc(o.name)}<br>المدينة: ${esc(o.city)}<br>المبلغ: ${esc(o.price)} DH`);
          markReceived(o.barcode);
        }
      });
    });
  } catch(e) {
    reader.style.display="none";
    showResult("bad","❌ تعذر تشغيل الكاميرا","تأكد من السماح للمتصفح باستخدام الكاميرا.");
  }
}

function loadScannerLib() {
  return new Promise((resolve,reject) => {
    const s=document.createElement("script");
    s.src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";
    s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
  });
}

render();
</script>
</body>
</html>

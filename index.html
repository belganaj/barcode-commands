<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode Commands</title>
<style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:15px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.file{background:#1769aa;color:white;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:bold}.secondary{background:#e8eef5;color:#243447}input,select{padding:11px;border:1px solid #ccd5e0;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f7f9fc;padding:12px;border-radius:10px}.stat b{display:block;font-size:24px}#reader{max-width:480px;margin:12px auto}.status{padding:10px;border-radius:9px;margin-top:8px}.ok{background:#e8f8ee;color:#176b37}.warn{background:#fff4d6;color:#805c00}.err{background:#fdeaea;color:#a02020}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:right}.received{background:#e8f8ee}@media(max-width:650px){.stats{grid-template-columns:1fr}table{font-size:12px}}</style></head>
<body><header><div class="wrap"><h1>📦 Barcode Commands</h1><small>مزامنة سحابية مع Google Sheets</small></div></header><main class="wrap">
<div class="card"><div class="row"><label class="file">📄 استيراد PDF<input id="pdf" type="file" accept="application/pdf" hidden></label><select id="man"><option value="">اختر Manifest</option></select><button class="secondary" id="refresh">↻ تحديث من السحابة</button></div><div id="imp"></div></div>
<div class="card"><div class="stats"><div class="stat">الإجمالي<b id="tot">0</b></div><div class="stat">تم التوصل به<b id="rec">0</b></div><div class="stat">المتبقي<b id="rem">0</b></div></div></div>
<div class="card"><div class="row"><input id="search" placeholder="بحث بالباركود أو الاسم أو الهاتف أو المدينة..." style="flex:1"><button id="scan">📷 مسح الباركود</button></div><div id="reader"></div><div id="scanmsg"></div></div>
<div class="card"><div style="overflow:auto"><table><thead><tr>
<th>Tracking</th><th>Type</th><th>Store</th><th>Designation & Quantity</th><th>Price</th><th>Address</th><th>City</th><th>Name</th><th>Phone</th><th>Status</th><th>استلام</th>
</tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://unpkg.com/html5-qrcode"></script><script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ضع رابط الـ Web App الخاص بك هنا بدل النص التوضيحي
const API="https://script.google.com/macros/s/AKfycbw8IH2dZk-vY8dA4755INt-rWxUSkuqSvH2uxo6zBnibMAVI1SXQ1JOYvMcqR7NTuf9/exec";

let ms=[],cur=null,scanner=null;
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function msg(id,t,c){$(id).innerHTML=t?`<div class="status ${c}">${t}</div>`:""}

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    let AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
  return audioCtx;
}

function beep(type) {
  try {
    let ctx = getAudioContext();
    if (!ctx) return;
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    if (type === "good") {
      osc.type = "sine"; osc.frequency.setValueAtTime(880, ctx.currentTime); osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    } else if (type === "repeat") {
      osc.type = "triangle"; osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    } else {
      osc.type = "sawtooth"; osc.frequency.setValueAtTime(220, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    }
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + (type=="good"?0.3:type=="repeat"?0.35:0.4));
  } catch(e) {}
}

async function loadFromCloud(){
  msg("imp","جاري مزامنة الملفات من Google Sheets...","warn");
  try {
    let res = await fetch(API);
    let data = await res.json();
    ms = data || [];
    history();
    if(ms.length > 0) {
      if(!cur) { $("man").value = ms[0].id; cur = ms[0]; }
      else { let exists = ms.find(x=>x.id==cur.id); if(exists) cur = exists; else { $("man").value = ms[0].id; cur = ms[0]; } }
      render();
    }
    msg("imp","","ok");
  } catch(e) {
    msg("imp","فشل الاتصال بـ Google Sheets. تأكد من صحة الرابط.","err");
  }
}

function history(){
  let s=$("man");
  let curVal = cur ? cur.id : s.value;
  s.innerHTML='<option value="">اختر Manifest</option>';
  ms.forEach(m=>{
    let o=document.createElement("option");
    o.value=m.id;
    o.textContent=m.fileName+" — "+m.orders.length+" طلب";
    s.appendChild(o);
  });
  if(curVal) s.value = curVal;
}

function render(){
  let a=cur?.orders||[],q=$("search").value.toLowerCase();
  let b=a.filter(o=>(o.barcode+" "+o.name+" "+o.phone+" "+o.city+" "+o.address+" "+o.store+" "+o.type+" "+o.product+" "+o.status).toLowerCase().includes(q));
  let r=a.filter(o=>o.received).length;
  $("tot").textContent=a.length; $("rec").textContent=r; $("rem").textContent=a.length-r;
  $("rows").innerHTML=b.map(o=>`
    <tr class="${o.received?"received":""}">
      <td><b>${esc(o.barcode)}</b></td>
      <td>${esc(o.type)}</td>
      <td>${esc(o.store)}</td>
      <td>${esc(o.product)}</td>
      <td>${esc(o.price)}</td>
      <td>${esc(o.address)}</td>
      <td>${esc(o.city)}</td>
      <td>${esc(o.name)}</td>
      <td>${esc(o.phone)}</td>
      <td>${esc(o.status)}</td>
      <td><button class="${o.received?"secondary":""}" onclick="toggle('${encodeURIComponent(o.barcode)}')">${o.received?"تم التوصل به":"استلام"}</button></td>
    </tr>
  `).join("");
}

window.toggle=e=>{
  getAudioContext();
  let o=cur.orders.find(x=>x.barcode==decodeURIComponent(e));
  o.received=!o.received;
  o.receivedAt=o.received?new Date().toISOString():"";
  if(o.received) beep("good");
  render(); syncReceipt(o);
}

function syncReceipt(o){
  fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"receipt",manifestId:cur.id,barcode:o.barcode,received:o.received,receivedAt:o.receivedAt})}).catch(()=>{});
}

async function pdftext(data){
  let p=await pdfjsLib.getDocument({data}).promise,t="";
  for(let i=1;i<=p.numPages;i++){
    let page=await p.getPage(i);
    let c=await page.getTextContent();
    let items = c.items.map(x => ({str: x.str, y: Math.round(x.transform[5]), x: Math.round(x.transform[4])}));
    items.sort((a, b) => b.y - b.y || a.x - b.x);
    t += " " + items.map(x => x.str).join(" ");
  }
  return t;
}

function parse(t){
  let z=[...t.matchAll(/\bS[A-Z0-9]{6,12}\b/g)],out=[],seen=new Set();
  for(let i=0;i<z.length;i++){
    let bc=z[i][0];
    if(seen.has(bc))continue;
    seen.add(bc);
    let s=t.slice(z[i].index+bc.length,i+1<z.length?z[i+1].index:t.length).replace(/\s+/g," ").trim();
    
    let phMatch = s.match(/(?:0|\+212)\s*[5-7](?:\s*\d){8}/);
    let ph = phMatch ? phMatch[0].replace(/\s/g,"") : "";
    
    let cities = ["Tiznit","Agadir","Tata","Guelmim","Marrakech","Casablanca","Rabat","Meknes","Fes","Oujda","Essaouira","Taroudant","Inezgane","Ait Melloul","Sidi Ifni","Mirleft"];
    let city = cities.find(c => new RegExp("\\b"+c+"\\b","i").test(s)) || "";
    
    let priceMatch = s.match(/(\d{1,5}[.,]\d{2})\s+\d/);
    let price = priceMatch ? priceMatch[1] : ((s.match(/(?:^|\s)(\d{1,4}[.,]\d{2})(?:\s|$)/) || [])[1] || "");

    let statusMatch = s.match(/En cours de dispatch|Livré|Retour|Annulé/i);
    let status = statusMatch ? statusMatch[0] : "";

    let arWords = s.split(/\s+/).filter(x => /[\u0600-\u06FF]/.test(x));
    let name = arWords.length > 0 ? arWords.slice(-2).join(" ") : "";

    let product = s.replace(bc, "").replace(ph, "").replace(city, "").replace(price, "").replace(status, "").replace(name, "").replace(/\s+/g, " ").trim();
    if(product.length > 80) product = product.slice(0, 80);

    out.push({
      barcode: bc, type: "TLN", store: "OSOGOLD", product: product, price: price,
      address: s.slice(0, 100), city: city, name: name, phone: ph, status: status,
      received: false, receivedAt: ""
    });
  }
  return out;
}

$("pdf").onchange=async e=>{
  getAudioContext();
  let f=e.target.files[0];
  if(!f)return;
  try{
    msg("imp","جاري تحليل ورفع الملف إلى جوجل شيت...","warn");
    let orders=parse(await pdftext(await f.arrayBuffer()));
    if(!orders.length)throw Error("لم يتم العثور على Tracking");
    cur={id:Date.now()+"_"+Math.random().toString(36).slice(2,6),fileName:f.name,uploadedAt:new Date().toISOString(),orders};
    ms.unshift(cur);
    history();
    $("man").value=cur.id;
    render();
    
    await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"import",manifest:cur})});
    msg("imp","تم رفع واستيراد "+orders.length+" طلب إلى جوجل شيت بنجاح.","ok");
  }catch(e){msg("imp",esc(e.message),"err")}
};

$("man").onchange=()=>{
  getAudioContext();
  cur=ms.find(x=>x.id==$("man").value)||null;
  render();
};

$("search").oninput=render;
$("refresh").onclick=loadFromCloud;

$("scan").onclick=async()=>{
  getAudioContext();
  if(scanner){await scanner.stop().catch(()=>{});scanner=null;$("reader").innerHTML="";$("scan").textContent="📷 مسح الباركود";return}
  scanner=new Html5Qrcode("reader");
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:140}},scanCode,()=>{});
    $("scan").textContent="⏹ إيقاف الكاميرا";
  }catch(e){scanner=null;msg("scanmsg","تعذر تشغيل الكاميرا. استخدم HTTPS واسمح بالكاميرا.","err")}
};

function scanCode(code){
  getAudioContext();
  let bc=String(code).trim().toUpperCase();
  if(scanner){scanner.stop().catch(()=>{});scanner=null;$("reader").innerHTML="";$("scan").textContent="📷 مسح الباركود";}
  if(!cur){beep("error");msg("scanmsg","اختر Manifest أولاً.","err");return;}
  let o=cur.orders.find(x=>x.barcode.toUpperCase()==bc);
  if(!o){beep("error");msg("scanmsg","❌ الباركود <b>"+esc(bc)+"</b> غير موجود.","err");return;}
  if(o.received){beep("repeat");msg("scanmsg","⚠️ هذا الطلب تم تسجيله مسبقاً كمستلم.","warn");return;}
  o.received=true;
  o.receivedAt=new Date().toISOString();
  syncReceipt(o); render();
  beep("good");
  msg("scanmsg","✅ تم التوصل بالطلب <b>"+esc(bc)+"</b>","ok");
}

// تحميل البيانات عند فتح الصفحة أول مرة
loadFromCloud();
</script></body></html>
